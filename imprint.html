<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mountain Ride</title>
<style>
  :root { --bg: #2b3d63; --card: #34496f; --ink: #f4f8fc; --accent: #ffc531; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; max-width: 760px; margin: 0 auto; padding: 16px; }
  header b { font-size: 20px; } header b span { color: var(--accent); }
  label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 0; }
  main { max-width: 760px; margin: 0 auto 24px; padding: 8px 20px 24px; background: var(--card); border-radius: 14px; }
  @media (max-width: 800px) { main { margin: 0 12px 24px; } }
  h1 { font-size: 26px; margin: 16px 0 8px; hyphens: auto; overflow-wrap: anywhere; } h2 { font-size: 18px; margin: 22px 0 4px; color: var(--accent); }
  p { margin: 6px 0; white-space: pre-line; overflow-wrap: anywhere; } a { color: var(--accent); }
  .updated { opacity: 0.7; font-size: 14px; margin-top: 20px; }
  footer { text-align: center; padding: 0 16px 28px; }
</style>
</head>
<body data-page="imprint">
<header><b>Mountain <span>Ride</span></b><label><span id="langLabel">Sprache</span><select id="lang"></select></label></header>
<main id="main"></main>
<footer><a id="other" href="#"></a></footer>
<script src="assets/lib/legal.js"></script>
<script src="assets/lib/legal-page.js"></script>
</body>
</html>
