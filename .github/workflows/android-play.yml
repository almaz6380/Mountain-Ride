# Builds the Android app bundle on GitHub and uploads it to Google Play.
# Start it by hand: GitHub → Actions → "Android → Google Play" → Run workflow.
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the upload key (.jks) as base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON (optional) – without it the .aab is only kept as a download (artifact "app-bundle")
# versionCode = run number + 3 (Play already has 1–3).
name: Android → Google Play

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown in the store'
        default: '1.0.1'
      track:
        description: 'Play track'
        type: choice
        options: [production, internal]
        default: production

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build www/ and sync Capacitor
        run: |
          npm ci
          python3 tools/build-pages.py --app
          npx cap sync android

      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"

      - name: Build signed app bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease -PversionCode=$((GITHUB_RUN_NUMBER + 3)) -PversionName='${{ inputs.version_name }}'
          ls -la app/build/outputs/bundle/release/

      - uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.track }}
          PLAY_STATUS: completed
          PLAY_RELEASE_NAME: ${{ inputs.version_name }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "No PLAY_SERVICE_ACCOUNT_JSON secret: bundle kept as artifact only"; exit 0; fi
          pip install --quiet google-api-python-client google-auth
          python3 tools/play-upload.py bundle android/app/build/outputs/bundle/release/app-release.aab
